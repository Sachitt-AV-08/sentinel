[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Local structured classification for agent action gating. No LLM in the decision path."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ollama = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
