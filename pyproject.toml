[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.2.0"
description = "Local structured classification for agent action gating. No LLM in the decision path."
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Sachitt", email = "sachittav@gmail.com" }]
keywords = ["classifier", "gate", "agent", "safety", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
readme = "README.md"

[project.optional-dependencies]
ollama = ["httpx>=0.27"]
dev = [
  "pytest>=8",
  "pytest-cov>=4.1",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Sachitt-AV-08/sentinel"
Repository = "https://github.com/Sachitt-AV-08/sentinel"
Issues = "https://github.com/Sachitt-AV-08/sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["sentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CLI is 0% (not unit-tested); core coverage is ~86%. Gate set at 75% with 2pt buffer.
fail_under = 68

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
