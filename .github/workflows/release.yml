name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # needed for PyPI trusted publishing

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --extra dev --extra ollama

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Test
        run: uv run --no-sync pytest --cov=sentinel

  build-and-release:
    needs: test-and-lint
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify version matches tag
        run: |
          PY_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${{ steps.version.outputs.VERSION }}" != "$PY_VERSION" ]; then
            echo "ERROR: Tag version (${{ steps.version.outputs.VERSION }}) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          echo "Version check passed: ${{ steps.version.outputs.VERSION }}"

      - name: Build
        run: |
          uv build
          ls -la dist/

      - name: Verify wheel contents
        run: |
          for w in dist/*.whl; do
            echo "=== $w ==="
            unzip -l "$w" | head -30
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## Sentinel ${{ github.ref_name }}

            ### Installation

            **From PyPI (recommended):**
            ```bash
            pip install sentinel
            pip install 'sentinel[ollama]'
            ```

            **From GitHub Release:**
            ```bash
            # Universal wheel (works on all Python 3.10+)
            pip install https://github.com/Sachitt-AV-08/sentinel/releases/download/${{ github.ref_name }}/sentinel-${{ steps.version.outputs.VERSION }}-py3-none-any.whl
            ```

            **From Git (always latest):**
            ```bash
            pip install 'sentinel[ollama]@git+https://github.com/Sachitt-AV-08/sentinel.git@${{ github.ref_name }}'
            uv pip install 'sentinel[ollama]@git+https://github.com/Sachitt-AV-08/sentinel.git@${{ github.ref_name }}'
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/Sachitt-AV-08/sentinel/main/install.ps1 | iex
            ```

            **macOS / Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Sachitt-AV-08/sentinel/main/install.sh | sh
            ```

            ### Verification
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Changes
            See commit history since last release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  smoke-install:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Download release wheel
        run: |
          WHEEL_URL="https://github.com/Sachitt-AV-08/sentinel/releases/download/${{ github.ref_name }}/sentinel-${{ needs.build-and-release.outputs.VERSION }}-py3-none-any.whl"
          curl -L -o "sentinel-${{ needs.build-and-release.outputs.VERSION }}-py3-none-any.whl" "$WHEEL_URL"
          ls -la *.whl

      - name: Test wheel install
        run: |
          WHEEL_FILE="sentinel-${{ needs.build-and-release.outputs.VERSION }}-py3-none-any.whl"
          pip install "sentinel[ollama] @ file://${PWD}/${WHEEL_FILE}"
          sentinel --version
          sentinel doctor --help